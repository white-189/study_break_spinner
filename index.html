<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Break Spinner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:430px;
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    margin-bottom:20px;
}

.wheel-wrapper{
    position:relative;
    width:320px;
    height:320px;
    margin:20px auto;
}

.pointer{
    position:absolute;
    top:-5px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:15px solid transparent;
    border-right:15px solid transparent;
    border-top:30px solid #333;
    z-index:10;
}

#wheel{
    width:300px;
    height:300px;
    border-radius:50%;
    border:5px solid #333;
    position:absolute;
    left:10px;
    top:10px;
    overflow:hidden;
    transition:transform 3s ease-out;
}

.label{
    position:absolute;
    color:#222;
    font-size:11px;
    font-weight:bold;
    text-align:center;
    width:70px;
    pointer-events:none;
}

button{
    padding:10px 15px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    background:#333;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#555;
}
    /* NEW FEATURE: greys out the Spin button while a spin is in progress */
button:disabled{
    background:#999;
    cursor:not-allowed;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
    min-height:30px;
}

.controls{
    text-align:left;
    margin-top:20px;
}

.controls h3{
    margin:10px 0;
}

input, select{
    width:100%;
    padding:8px;
    margin-bottom:10px;
}
</style>
</head>
<body>

<div class="container">

<h1>Study Break Spinner</h1>

<div class="wheel-wrapper">
    <div class="pointer"></div>
    <div id="wheel"></div>
</div>

<!-- NEW FEATURE: id="spinBtn" lets spinWheel() find and disable this button -->
<button id="spinBtn" onclick="spinWheel()">Spin</button>
 
<!-- NEW FEATURE: aria-live so screen readers announce the result automatically -->
<div id="result" aria-live="polite"></div>
<div class="controls">

    <h3>Add Activity</h3>
    <input type="text" id="newActivity" placeholder="Enter activity">
    <button onclick="addActivity()">Add Activity</button>

    <h3>Remove Activity</h3>
    <select id="activityList"></select>
    <button onclick="removeActivity()">Remove Selected</button>

</div>

</div>

<script>
let activities = [
    "Stretch",
    "Drink Water",
    "Walk",
    "Breathe",
    "Music",
    "Relax"
];

const colors = [
    "#ff9999",
    "#99ccff",
    "#99ff99",
    "#ffff99",
    "#ffcc99",
    "#d9b3ff",
    "#f7b267",
    "#84dcc6"
];
    

let currentRotation = 0;
    // NEW FEATURE (spin-lock): these two variables track whether a spin is
// currently animating, so a second click can't schedule a second timer
// that races the first one and briefly shows the wrong result.
let isSpinning = false;
let spinTimeoutId = null;

function drawWheel(){
    const wheel = document.getElementById("wheel");
    wheel.innerHTML = "";
    // NEW FEATURE: guard against building an invalid empty conic-gradient
    // if the user removes every activity.
    if(activities.length === 0){
        wheel.style.background = "#eee";
        updateList();
        return;
    }

    const angle = 360 / activities.length;

    // Create colored wheel
    let gradient = "conic-gradient(";
    for(let i=0;i<activities.length;i++){
        const start = i * angle;
        const end = start + angle;
        gradient += `${colors[i % colors.length]} ${start}deg ${end}deg`;
        if(i !== activities.length - 1) gradient += ", ";
    }
    gradient += ")";
    wheel.style.background = gradient;

    // Place labels in the center of each slice
    const radius = 95;
    for(let i=0;i<activities.length;i++){
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = activities[i];

        const middleAngle = (i * angle + angle / 2 - 90) * Math.PI / 180;

        const x = 150 + radius * Math.cos(middleAngle);
        const y = 150 + radius * Math.sin(middleAngle);

        label.style.left = x + "px";
        label.style.top = y + "px";
        label.style.transform = "translate(-50%, -50%)";

        wheel.appendChild(label);
    }

    updateList();
}

function updateList(){
    const list = document.getElementById("activityList");
    list.innerHTML = "";
    activities.forEach((a,i)=>{
        const option = document.createElement("option");
        option.value = i;
        option.textContent = a;
        list.appendChild(option);
    });
}

function spinWheel(){
    if(activities.length===0){
        alert("Please add at least one activity.");
        return;
    }
    // NEW FEATURE: ignore clicks while a spin is already in progress,
    // instead of letting a second spin's timeout race the first one.
    if(isSpinning) return;

    const wheel = document.getElementById("wheel");
    const result = document.getElementById("result");
     const spinBtn = document.getElementById("spinBtn"); // NEW FEATURE
    
    // NEW FEATURE: lock the spin and visually disable the button
    isSpinning = true;
    spinBtn.disabled = true

    //New change 
    const index = Math.floor(Math.random() * activities.length);

// Save the selected activity immediately
const selectedActivity = activities[index];

const angle = 360 / activities.length;

// Find the center of the selected slice
const selectedAngle = index * angle + angle / 2;

// Where the selected slice needs to be
// to stop under the pointer
const targetRotation = 360 - selectedAngle;

// Get the wheel's current rotation
const currentMod =
    (currentRotation % 360 + 360) % 360;

// Calculate how much more the wheel needs to rotate
let additionalRotation =
    targetRotation - currentMod;

// Make sure rotation is positive
if(additionalRotation < 0){
    additionalRotation += 360;
}

// Add 3 full rotations
additionalRotation += 1080;

// Update total rotation
currentRotation += additionalRotation;

// Spin the wheel
wheel.style.transform =
    `rotate(${currentRotation}deg)`;

result.textContent = "";

if(spinTimeoutId){
    clearTimeout(spinTimeoutId);
}

spinTimeoutId = setTimeout(() => {

    // Show the exact activity selected before spinning
    result.textContent =
        selectedActivity;

    isSpinning = false;
    spinBtn.disabled = false;
    spinTimeoutId = null;

}, 3000);
}

function addActivity(){
    const input = document.getElementById("newActivity");
    const value = input.value.trim();
    if(value==="") return;
    activities.push(value);
    input.value = "";
    drawWheel();
}

function removeActivity(){
    const list = document.getElementById("activityList");
   // NEW FEATURE: also bail out if nothing is selected (empty value)
    if(activities.length===0 || list.value==="") return;
    activities.splice(parseInt(list.value),1);
    drawWheel();
}

drawWheel();
</script>

</body>
</html>
